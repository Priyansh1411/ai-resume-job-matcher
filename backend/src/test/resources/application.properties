# Test-only override for the property that has no production default:
# jwt.secret. Never used outside the test classpath.
jwt.secret=test-only-jwt-signing-secret-for-automated-tests-32-bytes

# Integration tests share one Spring context (and so one RateLimiterService
# instance, and one MockMvc "remote address") across many test classes that
# each register their own throwaway user via TestAuthSupport - easily dozens
# of /api/auth/register calls in a single run, all against the same IP-keyed
# bucket. The real per-endpoint limits (see RateLimiterService's defaults) are
# sized for production traffic, not test fixture volume, and are already
# covered directly by RateLimiterServiceTest/RateLimitingFilterTest/
# AuthRateLimitingFilterTest, which construct RateLimiterService themselves
# with enabled=true and so are unaffected by this override.
rate-limit.enabled=false
