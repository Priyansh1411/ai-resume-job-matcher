# Test-specific overrides only - src/main/resources/application.properties
# remains the base configuration for every test, layered underneath this file
# by the "test" Spring profile (activated for every test JVM via pom.xml's
# maven-surefire-plugin systemPropertyVariables, not per-class annotations).
# Before Phase 14, this file was itself named application.properties, which
# has the exact same classpath-relative path as the main one - a plain
# classloader resource lookup finds only the first match, so the main file
# was never read during any test run at all, silently, for every phase up to
# and including Phase 13. Only put a key here if a test genuinely needs a
# different value than production; everything else should come from the main
# file precisely because it now actually does.
#
# jwt.secret has no production default (see the main file's own comment on
# why) and is never used outside the test classpath.
jwt.secret=test-only-jwt-signing-secret-for-automated-tests-32-bytes

# Integration tests share one Spring context (and so one RateLimiterService
# instance, and one MockMvc "remote address") across many test classes that
# each register their own throwaway user via TestAuthSupport - easily dozens
# of /api/auth/register calls in a single run, all against the same IP-keyed
# bucket. The real per-endpoint limits (see RateLimiterService's defaults) are
# sized for production traffic, not test fixture volume, and are already
# covered directly by RateLimiterServiceTest/RateLimitingFilterTest/
# AuthRateLimitingFilterTest, which construct RateLimiterService themselves
# with enabled=true and so are unaffected by this override.
rate-limit.enabled=false
