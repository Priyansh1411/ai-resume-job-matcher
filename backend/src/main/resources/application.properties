spring.application.name=resume-matcher-backend

# Surfaces RequestCorrelationFilter's requestId (blank outside a request, e.g. at startup) on every log line
logging.pattern.level=%5p [%X{requestId}]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:resume_matcher}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

matching.semantic.enabled=${MATCHING_SEMANTIC_ENABLED:false}
embedding.api.base-url=${EMBEDDING_API_BASE_URL:}
embedding.api.key=${EMBEDDING_API_KEY:}
embedding.api.model=${EMBEDDING_MODEL:text-embedding-3-small}

analysis.enabled=${ANALYSIS_ENABLED:false}
chat.api.base-url=${CHAT_API_BASE_URL:}
chat.api.key=${CHAT_API_KEY:}
chat.api.model=${CHAT_API_MODEL:gpt-4o-mini}

# metrics deliberately excluded: unauthenticated, it discloses DB pool
# internals, per-route request/status/timing breakdowns, and even internal
# filter class names (spring.security.filterchains.JwtAuthenticationFilter.*)
# - see Phase 8's ActuatorExposureIntegrationTest. health stays exposed; its
# own detail level already defaults to "never" (UP/DOWN only, no component
# breakdown), and it costs nothing to leave available for the platform
# convention of probing /actuator/health, even though nothing in this repo
# currently does so.
#
# prometheus carries the same class of sensitive detail metrics did (plus
# this app's own OpenAiMetrics/RateLimitMetrics/ResumeProcessingMetrics), so
# unlike health it is not left to this exposure list alone - SecurityConfiguration
# additionally requires authentication on /actuator/prometheus specifically.
management.endpoints.web.exposure.include=health,prometheus

rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.general.requests-per-minute=${RATE_LIMIT_GENERAL_RPM:60}
rate-limit.openai.requests-per-minute=${RATE_LIMIT_OPENAI_RPM:10}
rate-limit.auth-login.requests-per-minute=${RATE_LIMIT_AUTH_LOGIN_RPM:5}
rate-limit.auth-register.requests-per-minute=${RATE_LIMIT_AUTH_REGISTER_RPM:3}
rate-limit.auth-login-per-account.requests-per-minute=${RATE_LIMIT_AUTH_LOGIN_PER_ACCOUNT_RPM:5}

# No default: startup must fail if JWT_SECRET isn't set, rather than silently
# signing tokens with a predictable value. Must be at least 32 characters (256
# bits) for HS256.
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
