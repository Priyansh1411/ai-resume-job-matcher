spring.application.name=resume-matcher-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:resume_matcher}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

matching.semantic.enabled=${MATCHING_SEMANTIC_ENABLED:false}
embedding.api.base-url=${EMBEDDING_API_BASE_URL:}
embedding.api.key=${EMBEDDING_API_KEY:}
embedding.api.model=${EMBEDDING_MODEL:text-embedding-3-small}
