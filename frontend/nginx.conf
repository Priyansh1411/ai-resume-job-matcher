server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Same-origin reverse proxy: the frontend's own API calls already use
	# relative paths like /api/resumes/upload (see apiClient.ts), so this is
	# the only thing that needs to make those resolve in production - no
	# frontend code change required. The backend container has no published
	# host port of its own; this is its only route from the browser.
	location /api/ {
		proxy_pass http://backend:8080/api/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# SPA fallback: any path that isn't a real static asset falls back to
	# index.html so client-side routing (if any) keeps working on refresh/deep link.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
